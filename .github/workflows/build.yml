name: Build Windows EXE

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Compilar exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ICSeeLite `
            --collect-all av `
            --exclude-module tkinter `
            --exclude-module PyQt6.QtNetwork --exclude-module PyQt6.QtQml `
            --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtWebEngineCore `
            --exclude-module PyQt6.QtSql --exclude-module PyQt6.QtMultimedia `
            main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ICSeeLite-win64
          path: dist/ICSeeLite.exe

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ICSeeLite.exe
